<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Starwake</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070912">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
/* Layout: one fixed portrait screen. HUD on top, content flexes, thumb controls at the bottom. */
:root{
  --void:#070912; --deep:#0d1122; --panel:#131a31; --panel2:#1a2242; --line:#283363;
  --text:#e8edff; --dim:#8d98c6; --faint:#55608f;
  --ally:#5cc8ff; --foe:#ff7448; --gold:#ffc65c; --ion:#a08bff; --shield:#79b8ff;
  --good:#5ee3a4; --bad:#ff4f6d; --power:#7dffb0;
  --font:'Chakra Petch', ui-rounded, system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--void);-webkit-text-size-adjust:100%;text-size-adjust:100%;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--void);color:var(--text);font:15px/1.35 var(--font);
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;touch-action:manipulation}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 16px 12px;gap:10px}

/* HUD */
.hud{display:flex;align-items:center;gap:6px;padding:6px 12px 4px;font-size:13px;font-weight:600;letter-spacing:.02em;flex:none}
.hud .sec{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.res{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;white-space:nowrap;background:none;border:none;padding:6px 0;font-weight:600;font-size:13px}
.res em{font-style:normal;font-size:9px;letter-spacing:.08em;color:var(--dim);font-weight:600}
.iconbtn{min-width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:13px;padding:0 8px;flex:none}

/* Generic */
h1,h2,h3{margin:0;text-wrap:balance}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 16px;border-radius:14px;border:1px solid var(--line);
  background:var(--panel2);font-weight:600;font-size:16px;text-align:center;transition:transform .08s, background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#2c6fff,#1f4fd0);border-color:#4f86ff}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.35}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:600}
.dim{color:var(--dim)}
.stack{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-height:0}
.toast{position:absolute;left:16px;right:16px;bottom:36%;z-index:60;background:rgba(19,26,49,.96);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;pointer-events:none;transition:opacity .4s}

/* Title */
.title{justify-content:center;text-align:center}
.logo{font-size:56px;font-weight:700;letter-spacing:.06em;line-height:1;background:linear-gradient(180deg,#fff,#7fb8ff 60%,#3d63d6);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{color:var(--dim);font-size:15px;max-width:30ch;margin:8px auto 0}
.howto{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;color:#cdd5f5}
.howto b{color:var(--text)}
.howto p{margin:0 0 7px} .howto p:last-child{margin:0}
.meta{font-size:12px;color:var(--faint)}

/* Map */
.maphead{display:flex;justify-content:space-between;align-items:baseline}
.mapwrap{position:relative;flex:1;min-height:0;margin:34px 10px 30px}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:2px solid var(--line);background:var(--deep);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:var(--faint);padding:0}
.node small{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-top:-2px}
.node.combat{--c:var(--foe)} .node.elite{--c:#ff3d5e} .node.event{--c:var(--ally)} .node.shop{--c:var(--gold)} .node.gate{--c:var(--good)} .node.boss{--c:#ff3d5e} .node.start{--c:var(--dim)}
.node.reach{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--deep));animation:pulse 1.6s ease-in-out infinite}
.node.seen{opacity:.45;color:var(--c)}
.node.here{border-color:#fff;color:#fff;opacity:1;box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.node.boss,.node.gate{width:60px;height:60px;margin:-30px 0 0 -30px}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 22%,transparent)}}
.legend{display:flex;justify-content:center;gap:12px;font-size:11px;color:var(--dim);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:var(--c)}

/* Panels: event, shop, reward */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.evtitle{font-size:24px;font-weight:700}
.evtext{font-size:16px;color:#d5dcf7;line-height:1.45;margin:0}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.choice{justify-content:flex-start;text-align:left;font-size:15px}
.choice.gated{border-color:#2f5fa8;background:#14244a}
.changes{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.chip.up{color:var(--good)} .chip.down{color:var(--bad)}
.offers{display:flex;flex-direction:column;gap:10px}
.offer{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.offer:active{transform:scale(.98)}
.offer .nm{font-weight:700;font-size:17px}
.offer .ds{font-size:13px;color:var(--dim)}
.offer.weapon .tag{color:var(--foe)} .offer.perk .tag{color:var(--ally)} .offer.repair .tag{color:var(--good)} .offer.recruit .tag{color:var(--gold)} .offer.up .tag{color:var(--power)}
.shoplist{display:flex;flex-direction:column;gap:7px;overflow:auto;min-height:0}
.srow{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.srow .info{flex:1;min-width:0}
.srow .nm{font-weight:600;font-size:14.5px}
.srow .ds{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buy{min-width:70px;height:44px;border-radius:10px;border:1px solid #6b5420;background:#2a2412;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.buy[disabled]{opacity:.35}
.shophead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--deep);font-weight:600;color:var(--dim)}
.tab.on{background:var(--panel2);color:var(--text);border-color:#4f86ff}

/* Combat */
.cbt{flex:1;min-height:0;display:flex;flex-direction:column}
.panel{padding:4px 12px;flex:none}
.prow{display:flex;align-items:center;gap:8px}
.pname{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.bar{position:relative;height:12px;border-radius:6px;background:#0a0e1d;border:1px solid var(--line);overflow:hidden;flex:1}
.bar b{position:absolute;inset:0 auto 0 0;background:var(--good);border-radius:6px;transition:width .15s}
.foe .bar b{background:var(--foe)}
.hpnum{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.pips{display:flex;gap:3px;align-items:center}
.pip{width:14px;height:8px;border-radius:4px;border:1px solid var(--shield);opacity:.35}
.pip.on{background:var(--shield);opacity:1;box-shadow:0 0 6px var(--shield)}
.pip.over{background:#fff;border-color:#fff;opacity:1}
.targets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.tgt{position:relative;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;font-size:12.5px;font-weight:600}
.tgt.sel{border-color:var(--foe);background:color-mix(in srgb,var(--foe) 16%,var(--panel));box-shadow:inset 0 0 0 1px var(--foe)}
.tgt.sel::after{content:"TARGET";position:absolute;top:-7px;right:6px;font-size:8.5px;letter-spacing:.1em;background:var(--foe);color:#1a0a04;padding:1px 4px;border-radius:4px}
.bars{display:flex;gap:2px}
.bars i{width:7px;height:6px;border-radius:2px;background:transparent;border:1px solid #3a4677}
.bars i.on{background:var(--power);border-color:var(--power)}
.bars i.idle{border-color:#6a7bb8}
.bars i.dmg{background:#5a1f2d;border-color:var(--bad)}
.bars i.ion{background:#3a2d6e;border-color:var(--ion)}
.ewps{display:grid;gap:5px;margin-top:6px}
.ew{position:relative;height:18px;border-radius:5px;background:var(--deep);border:1px solid var(--line);overflow:hidden;font-size:10px;font-weight:600;display:flex;align-items:center;padding:0 6px;color:var(--dim);font-family:inherit;width:100%;text-align:left}
.ew b{position:absolute;inset:0 auto 0 0;background:rgba(255,116,72,.28)}
.ew span{position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ew.hot{border-color:var(--bad);color:#fff;animation:hot .35s ease-in-out infinite alternate}
.ew.hot b{background:rgba(255,79,109,.55)}
.ew.off{opacity:.4}
.blind{margin-top:6px;height:18px;font-size:10.5px;color:var(--faint);text-align:center;border:1px dashed var(--line);border-radius:5px;line-height:16px}
@keyframes hot{to{box-shadow:0 0 8px var(--bad)}}
canvas{flex:1;min-height:0;width:100%;display:block}
.reactor{font-size:11px;font-weight:700;color:var(--power);white-space:nowrap;font-variant-numeric:tabular-nums}
.systems{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:5px}
.sysc{position:relative;height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600;color:var(--dim);background:var(--deep);border:1px solid var(--line);border-radius:9px;padding:0}
.sysc .cr{position:absolute;top:-6px;right:3px;font-size:8.5px;font-weight:700;background:var(--gold);color:#1d1606;border-radius:4px;padding:0 3px}
.sysc .cr.hurt{background:var(--bad);color:#fff}
.weps{display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;margin-top:6px}
.wep{position:relative;height:26px;border-radius:7px;background:var(--deep);border:1px solid var(--line);overflow:hidden;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:0 7px;font-family:inherit;color:inherit;width:100%}
.wep b{position:absolute;inset:0 auto 0 0;background:rgba(92,200,255,.25)}
.wep.ready b{background:rgba(92,200,255,.5)}
.wep.noammo{color:var(--bad)}
.wep.off{opacity:.45;border-style:dashed}
.wep.nopow{color:var(--bad)}
.wep span{position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wep .pc{position:relative;font-size:10px;color:var(--power);flex:none}
.abil{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 12px 8px;flex:none}
.ab{position:relative;height:60px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-weight:700;font-size:14px}
.ab small{font-size:10.5px;font-weight:500;color:var(--dim)}
.ab .cd{position:absolute;inset:auto 0 0 0;height:calc(var(--p,0)*100%);background:rgba(7,9,18,.72);pointer-events:none}
.ab .lbl{position:relative;display:flex;flex-direction:column;align-items:center}
.ab.ready{border-color:var(--k);box-shadow:inset 0 0 0 1px var(--k), 0 0 14px color-mix(in srgb,var(--k) 30%,transparent)}
.ab.active{background:color-mix(in srgb,var(--k) 30%,var(--panel2))}
.ab:active{transform:scale(.96)}
.ab.surge{--k:var(--shield)} .ab.evade{--k:var(--good)} .ab.od{--k:var(--gold)}
.ab.incoming::before{content:"INCOMING";position:absolute;top:4px;left:0;right:0;font-size:8.5px;letter-spacing:.12em;color:var(--bad);font-weight:700;z-index:1}
.ab.incoming.ready{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad),0 0 16px rgba(255,79,109,.45)}

/* Overlay */
.overlay{position:absolute;inset:0;z-index:40;background:rgba(5,7,15,.88);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;flex-direction:column;padding:14px 16px;gap:10px}
.overlay .card{overflow:auto;min-height:0}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;border-bottom:1px solid #1d2546}
.kv:last-child{border:none}
.list{display:flex;flex-direction:column;gap:6px}
.li{font-size:13.5px}
.li b{display:block;font-size:14.5px}
.li span{color:var(--dim)}
.guide h3{font-size:15px;margin:2px 0 4px;color:var(--ally)}
.guide p{margin:0 0 10px;font-size:13.5px;color:#cdd5f5;line-height:1.45}
.guide p:last-child{margin:0}

/* Power sheet */
.pwlist{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0;flex:1}
.pwrow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px}
.pwrow .info{flex:1;min-width:0}
.pwrow .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.pwrow .ds{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwb{width:46px;height:46px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);font-size:22px;font-weight:700;padding:0;flex:none}
.pwb[disabled]{opacity:.3}
.tog{min-width:64px;height:46px;border-radius:11px;border:1px solid var(--line);background:var(--deep);font-weight:700;font-size:13px;flex:none;color:var(--dim)}
.tog.on{background:color-mix(in srgb,var(--power) 18%,var(--deep));border-color:var(--power);color:var(--power)}
.reactorbig{display:flex;align-items:center;gap:10px;font-weight:700}
.reactorbig .bars i{width:12px;height:10px}

/* Crew */
.crewlist{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0;flex:1}
.crew{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.crow{display:flex;align-items:baseline;gap:8px}
.crow b{font-size:16px}
.lv{font-size:12px;font-weight:700;color:var(--gold)}
.hp{font-size:12px;font-weight:700;color:var(--good)} .hp.low{color:var(--bad)}
.trait{margin-left:auto;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ally);font-weight:600}
.crew .ds{font-size:12px;color:var(--dim);margin:2px 0 6px}
.xpbar{height:4px;border-radius:2px;background:#0a0e1d;overflow:hidden;margin-bottom:8px}
.xpbar b{display:block;height:100%;background:var(--gold)}
.stchips{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.stc{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--deep);font-size:11px;font-weight:600;padding:0;color:var(--dim)}
.stc.on{border-color:var(--ally);color:var(--text);background:color-mix(in srgb,var(--ally) 20%,var(--deep))}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stbox{background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;min-width:0}
.stbox b{display:block;font-size:12.5px}
.stbox span{color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (max-height:700px){
  .ab{height:52px} .tgt{height:42px} .logo{font-size:46px} .node{width:46px;height:46px;margin:-23px 0 0 -23px}
  .btn{min-height:48px} .sysc{height:38px}
}
@media (prefers-reduced-motion:reduce){ .node.reach,.ew.hot{animation:none} }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ---------- helpers ---------- */
const R = Math.random;
const ri = (a,b)=>a+Math.floor(R()*(b-a+1));
const pick = a=>a[Math.floor(R()*a.length)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle = a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sum = a=>a.reduce((x,y)=>x+y,0);
const app = document.getElementById('app');
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- block zoom gestures on iOS ---------- */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{ if(e.touches.length>1 || !e.target.closest('.shoplist,.overlay .card,.crewlist,.pwlist,.guide')) e.preventDefault(); },{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});

/* ---------- data ---------- */
const SECTORS = ['Cinder Reach','The Glass Shoals',"Regent's Crown"];
const TGT = {shd:'Shields', wep:'Weapons', eng:'Engines'};
// Ship systems. Each installed bar can hold one unit of reactor power.
const SYSDEF = {
  shd:{name:'Shields',    max:8, price:22, what:'2 power = 1 shield layer'},
  wep:{name:'Weapons',    max:8, price:20, what:'Powers your weapons (each weapon shows its cost)'},
  eng:{name:'Engines',    max:6, price:16, what:'5% evasion per power. Needs a pilot on the Bridge'},
  sen:{name:'Sensors',    max:3, price:24, what:'1: see enemy weapon charge · 2-3: +10% accuracy each'},
  rep:{name:'Repair Bay', max:3, price:24, what:'Faster system repairs and heals crew in combat'},
};
const SYSORDER = ['shd','wep','eng','sen','rep'];
const TYPE_NOTE = {
  laser:'Each shot pops one shield layer before it can hurt the hull.',
  ion:'Strips a shield layer and jams it for a few seconds. If shields are down, jams one bar of the target system.',
  missile:'Ignores shields. Uses one missile per volley.',
  beam:'Never misses. Loses 1 damage per enemy shield layer.'
};
const WEAPONS = {
  needle:  {name:'Needle Laser',  type:'laser',  dmg:1, shots:1, cd:6,  tier:1, pw:1},
  pulse:   {name:'Pulse Cannon',  type:'laser',  dmg:1, shots:2, cd:9,  tier:1, pw:2},
  flak:    {name:'Flak Repeater', type:'laser',  dmg:1, shots:3, cd:12, tier:2, pw:2},
  lance:   {name:'Heavy Lance',   type:'laser',  dmg:2, shots:1, cd:10, tier:2, pw:2},
  scatter: {name:'Scatter Burst', type:'laser',  dmg:1, shots:4, cd:13, tier:3, pw:3},
  ion:     {name:'Ion Spike',     type:'ion',    dmg:1, shots:1, cd:8,  tier:1, pw:1},
  ionstorm:{name:'Ion Storm',     type:'ion',    dmg:1, shots:2, cd:11, tier:2, pw:2},
  seeker:  {name:'Seeker Missile',type:'missile',dmg:2, shots:1, cd:11, tier:1, pw:1, ammo:true},
  torpedo: {name:'Breach Torpedo',type:'missile',dmg:3, shots:1, cd:14, tier:2, pw:2, ammo:true, sys:2},
  swarm:   {name:'Swarm Pod',     type:'missile',dmg:1, shots:3, cd:15, tier:3, pw:2, ammo:true},
  arc:     {name:'Arc Beam',      type:'beam',   dmg:3, shots:1, cd:13, tier:2, pw:2},
  sunlance:{name:'Sunlance Beam', type:'beam',   dmg:5, shots:1, cd:18, tier:3, pw:3},
};

/* ---------- persistence ---------- */
let run = null, meta = {runs:0, wins:0, best:0, tips:true};
let view = 'title';
const SAVE_KEY='starwake.run.v3';
function load(){
  try{ const s=localStorage.getItem(SAVE_KEY); run = s?JSON.parse(s):null; }catch(e){ run=null; }
  try{ const m=localStorage.getItem('starwake.meta'); if(m) meta=Object.assign(meta,JSON.parse(m)); }catch(e){}
}
function save(){
  try{
    if(run) localStorage.setItem(SAVE_KEY,JSON.stringify(run)); else localStorage.removeItem(SAVE_KEY);
    localStorage.setItem('starwake.meta',JSON.stringify(meta));
  }catch(e){}
}
const perk = id=>(run && run.perks[id])||0;

/* ---------- crew ---------- */
const crewAt=k=>run&&run.crew.find(c=>c.station===k);
const stLv=k=>{const c=crewAt(k);return c?c.lv:0};
const traitCount=t=>run?run.crew.filter(c=>c.trait===t).length:0;
const recruitLv=()=>run.sector>=3?2:1;
const crewMax=c=>10+(c.trait==='tough'?6:0);
function makeCrew(lv=1){
  const used=new Set((run&&run.crew||[]).map(c=>c.name));
  const c={name:pick(NAMES.filter(n=>!used.has(n))), trait:pick(Object.keys(TRAITS)), lv, xp:XPN[lv-1], station:null, hp:10};
  c.hp=crewMax(c); return c;
}
function addCrew(c){
  if(run.crew.length>=MAXCREW) return false;
  c.station=['helm','shd','wep','eng'].find(k=>!crewAt(k))||null;
  run.crew.push(c); return true;
}
function giveXP(c,n,out){
  c.xp+=Math.round(n*(c.trait==='quick'?1.5:1));
  let lv=1; while(lv<5 && c.xp>=XPN[lv]) lv++;
  if(lv>c.lv){ c.lv=lv; if(out) out.push([`${c.name} reached Lv ${lv}`,true]); }
}
function hurtCrew(c,n,out){
  c.hp-=n;
  if(c.hp<=0){ run.crew.splice(run.crew.indexOf(c),1); if(out) out.push([`${c.name} died`,false]); return true; }
  if(out) out.push([`${c.name} -${n} health`,false]);
  return false;
}

/* ---------- power (out of combat) ---------- */
const wantSum=()=>sum(['shd','eng','sen','rep'].map(k=>run.power[k]))+sum(run.weapons.filter(w=>w.on).map(w=>WEAPONS[w.id].pw));
const spare=()=>run.reactor-wantSum();
function autoPower(){
  // fill in order of importance, respecting installed bars
  run.power={shd:0,eng:0,sen:0,rep:0};
  run.weapons.forEach(w=>w.on=false);
  let left=run.reactor;
  const give=(k,n)=>{const a=Math.min(n,left,run.sys[k].lvl-run.power[k]); run.power[k]+=a; left-=a;};
  give('shd',2);
  let wcap=run.sys.wep.lvl;
  for(const w of run.weapons){ const c=WEAPONS[w.id].pw; if(c<=left && c<=wcap){ w.on=true; left-=c; wcap-=c; } }
  give('eng',2); give('sen',1); give('shd',2); give('eng',4); give('shd',8); give('rep',3); give('sen',3); give('eng',6);
}

  addCrew(makeCrew(1)); addCrew(makeCrew(1)); addCrew(makeCrew(1));
  autoPower();

}

function genMap(sector){
  const rows=7, nodes=[];
  let id=0; const byRow=[];
  for(let r=0;r<rows;r++){
    const n = (r===0||r===rows-1)?1:ri(2,r===3?4:3);
    byRow.push([]);
    for(let i=0;i<n;i++){
      const x = n===1?.5: .12 + (.76*i/(n-1)) + (R()-.5)*.08;
      let type;
      if(r===0) type='start';
      else if(r===rows-1) type = sector===3?'boss':'gate';
      else {
        const roll=R();
        if(r===1) type = roll<.6?'combat':'event';
        else if(r>=3 && roll<.18) type='elite';
        else if(roll<.52) type='combat';
        else if(roll<.88) type='event';
        else type='shop';
      }
      const node={id:id++, r, x, type, to:[]};
      nodes.push(node); byRow[r].push(node);
    }
  }
  const mid = byRow[ri(3,4)];
  if(!byRow[3].concat(byRow[4]).some(n=>n.type==='shop')) pick(mid).type='shop';
  for(let r=0;r<rows-1;r++){
    const a=byRow[r], b=byRow[r+1];
    a.forEach((n,i)=>{
      const j = a.length===1? null : Math.round(i*(b.length-1)/(a.length-1));
      if(j===null){ b.forEach(m=>n.to.push(m.id)); return; }
      n.to.push(b[j].id);
      if(R()<.45 && b[j+1]) n.to.push(b[j+1].id);
      else if(R()<.3 && b[j-1]) n.to.push(b[j-1].id);
    });
    b.forEach((m,k)=>{
      if(!a.some(n=>n.to.includes(m.id))){
        const i = a.length===1?0:Math.round(k*(a.length-1)/Math.max(1,b.length-1));
        a[i].to.push(m.id);
      }
    });
  }
  nodes[0].seen=true;
  return nodes;
}

/* ---------- outcomes ---------- */
function applyGain(d){
  const ch=[];
  if(d.hull){ const before=run.hull; run.hull=clamp(run.hull+d.hull,1,run.hullMax); const v=run.hull-before; if(v) ch.push([`${v>0?'+':''}${v} hull`,v>0]); }
  if(d.fuel){ run.fuel=Math.max(0,run.fuel+d.fuel); ch.push([`${d.fuel>0?'+':''}${d.fuel} fuel`,d.fuel>0]); }
  if(d.scrap){ run.scrap=Math.max(0,run.scrap+d.scrap); ch.push([`${d.scrap>0?'+':''}${d.scrap} scrap`,d.scrap>0]); }
  if(d.missiles){ run.missiles=Math.max(0,run.missiles+d.missiles); ch.push([`${d.missiles>0?'+':''}${d.missiles} missiles`,d.missiles>0]); }
  if(d.perk){ givePerk(d.perk); ch.push([PERKS[d.perk].name,true]); }
  if(d.reactor){ run.reactor+=d.reactor; ch.push([`+${d.reactor} reactor power`,true]); }
  if(d.crew){ const c=makeCrew(d.crew); if(addCrew(c)) ch.push([`${c.name} joins (${TRAITS[c.trait].name})`,true]); else { run.scrap+=15; ch.push(['Crew full: +15 scrap',true]); } }
  if(d.xp){ ch.push([`Crew +${d.xp} XP`,true]); run.crew.forEach(c=>giveXP(c,d.xp,ch)); }
  if(d.lvOne){ const pool=run.crew.filter(c=>c.lv<5); if(pool.length){ const c=pick(pool); c.xp=Math.max(c.xp,XPN[c.lv]); giveXP(c,0,ch); } }
  if(d.hurt && run.crew.length){ const c=pick(run.crew); hurtCrew(c,d.hurt,ch); }
  if(d.hurtAll){ run.crew.slice().forEach(c=>hurtCrew(c,d.hurtAll,ch)); }
  if(d.heal){ run.crew.forEach(c=>c.hp=Math.min(crewMax(c),c.hp+d.heal)); ch.push([`Crew healed`,true]); }
  if(d.loseCrew && run.crew.length>1){ const c=run.crew.splice(ri(0,run.crew.length-1),1)[0]; ch.push([`${c.name} is gone`,false]); }
  return ch;
}
function givePerk(id){ run.perks[id]=(run.perks[id]||0)+1; const p=PERKS[id]; if(p.apply) p.apply(run); }
function randPerk(){ const ok=Object.keys(PERKS).filter(k=>perk(k)<PERKS[k].max); return pick(ok.length?ok:['plating']); }
function randWeapon(maxTier){ const ok=Object.keys(WEAPONS).filter(k=>WEAPONS[k].tier<=maxTier); return pick(ok); }
const gain=(d,text)=>({text, changes:applyGain(d)});
const fight=(foe,text,elite)=>({text, changes:[], fight:foe, elite:!!elite});
const gainWeapon=text=>{ const w=randWeapon(Math.min(3,run.sector+1)); return {text:`${text} It's a ${WEAPONS[w].name}.`, changes:[[WEAPONS[w].name,true]], weapon:w}; };

/* ---------- moving on the map ---------- */
function jump(id){
  const here=run.map[run.pos], node=run.map[id];
  if(!here.to.includes(id)) return;
  let fumes=false;
  if(run.fuel>0) run.fuel--; else { run.hull=Math.max(1,run.hull-3); fumes=true; }
  run.pos=id; node.seen=true; run.jumps++;
  enterNode(node, fumes);
  save(); render();
}
function foePool(){ return Object.keys(FOES).filter(k=>!['sentry','gate','boss','hunter','slaver'].includes(k) && (FOES[k].min||1)<=run.sector); }
function enterNode(node, fumes){
  const pre = fumes?'Out of fuel. You limp along on reserve power and take 3 hull damage. ':'';
  switch(node.type){
    case 'combat': run.pending={kind:'combat', foe:pick(foePool()), intro:pre}; break;
    case 'elite': run.pending={kind:'combat', foe:pick(foePool()), elite:true, intro:pre}; break;
    case 'gate': run.pending={kind:'combat', foe:'gate', intro:pre, gate:true}; break;
    case 'boss': run.pending={kind:'combat', foe:'boss', intro:pre, boss:true}; break;
    case 'shop': run.pending={kind:'shop', stock:makeStock(), tab:'gear', intro:pre}; break;
    case 'event': {
      const okEv=e=>!e.minCrew||run.crew.length>=e.minCrew;
      let pool=EVENTS.filter(e=>!run.seen.includes(e.id)&&okEv(e)); if(!pool.length){ run.seen=[]; pool=EVENTS.filter(okEv); }
      const e=pick(pool); run.seen.push(e.id);
      run.pending={kind:'event', id:e.id, intro:pre}; break;
    }
  }
}

/* ---------- shop / rewards ---------- */
const WPRICE=[0,32,52,78];
const upPrice=k=>k==='reactor'?18+3*run.reactor:SYSDEF[k].price+6*run.sys[k].lvl;
const upMaxed=k=>k==='reactor'?run.reactor>=16:run.sys[k].lvl>=SYSDEF[k].max;
function buyUp(k){ if(k==='reactor') run.reactor++; else run.sys[k].lvl++; }
const upName=k=>k==='reactor'?'Reactor +1':`${SYSDEF[k].name} +1 bar`;
const upDesc=k=>k==='reactor'?`More power to spread around (now ${run.reactor})`:`${SYSDEF[k].what} (now ${run.sys[k].lvl}/${SYSDEF[k].max})`;
function makeStock(){
  const ws=shuffle(Object.keys(WEAPONS).filter(k=>WEAPONS[k].tier<=run.sector+1)).slice(0,3);
  const ps=shuffle(Object.keys(PERKS).filter(k=>perk(k)<PERKS[k].max)).slice(0,2);
  const c=makeCrew(recruitLv());
  return [...ws.map(id=>({kind:'weapon',id,price:WPRICE[WEAPONS[id].tier]})), ...ps.map(id=>({kind:'perk',id,price:42+6*run.sector})), {kind:'crew',id:c.name,c,price:40+8*run.sector}];
}
function makeOffers(rich){
  const out=[], used=new Set();
  const tierCap=Math.min(3,run.sector+(rich?1:0));
  let guard=0;
  while(out.length<3 && guard++<50){
    const roll=R(); let o;
    if(roll<.32){ const ups=['reactor','reactor','shd','wep','eng','sen','rep'].filter(k=>!upMaxed(k)); if(!ups.length) continue; o={kind:'up',id:pick(ups)}; }
    else if(roll<.58){ o={kind:'weapon',id:randWeapon(tierCap)}; }
    else if(roll<.8){ o={kind:'perk',id:randPerk()}; }
    else if(roll<.9 && run.crew.length<MAXCREW){ const c=makeCrew(recruitLv()); o={kind:'crew',id:c.name,c}; }
    else o={kind:'repair',id:'repair'};
    const key=o.kind+o.id; if(used.has(key)) continue; used.add(key); out.push(o);
  }
  return out;
}
function bayNote(){ return run.weapons.length<4?`Adds to your arsenal (${run.weapons.length}/4 bays used).`:'Bays full: you choose a weapon to replace.'; }
function offerTitle(o){ return o.kind==='weapon'?WEAPONS[o.id].name:o.kind==='perk'?PERKS[o.id].name:o.kind==='crew'?`${o.c.name}, ${TRAITS[o.c.trait].name}`:o.kind==='up'?upName(o.id):'Field Repairs'; }
function offerDesc(o){ return o.kind==='weapon'?`${wdesc(o.id)}. ${TYPE_NOTE[WEAPONS[o.id].type]} ${bayNote()}`:o.kind==='perk'?PERKS[o.id].desc:o.kind==='crew'?`Lv ${o.c.lv} crew. ${TRAITS[o.c.trait].desc}.`:o.kind==='up'?upDesc(o.id):'Repair 12 hull and heal all crew'; }
function shopDesc(s){ return s.kind==='weapon'?wdesc(s.id):s.kind==='perk'?PERKS[s.id].desc:`Crew Lv ${s.c.lv} · ${TRAITS[s.c.trait].desc}`; }
function installWeapon(id){ run.weapons.push({id,on:false}); const c=WEAPONS[id].pw; if(spare()>=c && sum(run.weapons.filter(w=>w.on).map(w=>WEAPONS[w.id].pw))+c<=run.sys.wep.lvl) run.weapons[run.weapons.length-1].on=true; }
function takeOffer(o, next){
  if(o.kind==='perk') givePerk(o.id);
  else if(o.kind==='crew'){ if(!addCrew(o.c)) run.scrap+=15; }
  else if(o.kind==='up') buyUp(o.id);
  else if(o.kind==='repair'){ run.hull=Math.min(run.hullMax,run.hull+12); run.crew.forEach(c=>c.hp=crewMax(c)); }
  else if(o.kind==='weapon'){
    if(run.weapons.length<4) installWeapon(o.id);
    else { run.pending={kind:'replace', weapon:o.id, next}; return; }
  }
  finishPending(next);
}
function finishPending(next){
  if(next==='gate'){ nextSector(); return; }
  if(next==='victory'){ endRun(true); return; }
  run.pending=null;
}
function nextSector(){
  run.sector++;
  run.map=genMap(run.sector); run.pos=0;
  run.hull=Math.min(run.hullMax,run.hull+6);
  run.pending={kind:'outcome', title:`Entering ${SECTORS[run.sector-1]}`, text:'The gate spits you out into a new sector. Dock crews at the far side patch 6 hull for free. Enemies here are tougher and better armed.', changes:[]};
}
let lastRun=null;
function endRun(won){
  const sec=run.sector;
  meta.best=Math.max(meta.best, won?4:sec);
  if(won) meta.wins++;
  lastRun={won, sector:sec, jumps:run.jumps, kills:run.kills, weapons:run.weapons.map(w=>w.id), crew:run.crew.length};
  run=null; view='end';
}

/* ---------- rendering (non-combat) ---------- */
function hud(extra=''){
  return `<div class="hud">
    <div class="sec">${run?`S${run.sector} · ${SECTORS[run.sector-1]}`:''}</div>
    <button class="res h" data-act="tip" data-k="h"><em>HULL</em><span>${run.hull}/${run.hullMax}</span></button>
    <button class="res f" data-act="tip" data-k="f"><em>FUEL</em><span>${run.fuel}</span></button>
    <button class="res m" data-act="tip" data-k="m"><em>MSL</em><span>${run.missiles}</span></button>
    <button class="res s" data-act="tip" data-k="s"><em>SCRAP</em><span>${run.scrap}</span></button>
    ${extra}
  </div>`;
}
function render(){
  stopCombat();
  if(view==='title') return renderTitle();
  if(view==='end') return renderEnd();
  const p=run.pending;
  if(!p) return renderMap();
  ({combat:startCombat, event:renderEvent, outcome:renderOutcome, shop:renderShop, reward:renderReward, replace:renderReplace})[p.kind](p);
}
function renderTitle(){
  app.innerHTML=`<div class="screen title">
    <div><div class="logo">STARWAKE</div><p class="tagline">Cross three hostile sectors in a lone gunship. Every jump is a gamble.</p></div>
    <div class="howto">
      <p><b>Your reactor is the limit.</b> Shields, weapons, engines, sensors, and the repair bay all draw power, and you never have enough for everything. Tap a system in combat to move power around.</p>
      <p><b>Combat runs itself.</b> Powered weapons fire on their own. You pick the enemy system to hit and time Evade, Surge, and Overdrive against their red charge bars.</p>
      <p><b>Crew make it work.</b> A pilot on the Bridge is needed to dodge. Crew level up, but they can be hurt or killed when their station takes hits.</p>
    </div>
    <div class="stack">
      ${run?`<button class="btn primary" data-act="continue">Continue run · Sector ${run.sector}</button>`:''}
      <button class="btn ${run?'':'primary'}" data-act="new">${run?'Start over':'Launch'}</button>
      <button class="btn ghost" data-act="guide">How it works</button>
    </div>
    <div class="meta">${meta.runs?`Runs ${meta.runs} · Wins ${meta.wins} · Best: ${meta.best>=4?'flagship destroyed':'sector '+meta.best}`:'Progress saves automatically on this device.'}</div>
  </div>`;
}
function renderMap(){
  const here=run.map[run.pos];
  const W=n=>`${(n.x*100).toFixed(2)}%`, H=n=>`${(100-n.r/6*100).toFixed(2)}%`;
  let lines='';
  run.map.forEach(n=>n.to.forEach(t=>{const m=run.map[t];
    const live = n.id===here.id;
    lines+=`<line x1="${n.x*100}" y1="${100-n.r/6*100}" x2="${m.x*100}" y2="${100-m.r/6*100}" stroke="${live?'#8fb3ff':'#283363'}" stroke-width="${live?2.5:1.5}" ${live?'':'stroke-dasharray="4 4"'} vector-effect="non-scaling-stroke"/>`;}));
  const LBL={start:['·','Start'],combat:['!','Hostile'],elite:['!!','Elite'],event:['?','Signal'],shop:['$','Trader'],gate:['»','Gate'],boss:['☗','Flagship']};
  const nodes=run.map.map(n=>{
    const reach=here.to.includes(n.id);
    const cls=['node',n.type, reach?'reach':'', n.id===here.id?'here':(n.seen?'seen':'')].join(' ');
    return `<button class="${cls}" style="left:${W(n)};top:${H(n)}" ${reach?`data-act="jump" data-id="${n.id}"`:'disabled'} aria-label="${LBL[n.type][1]}">${LBL[n.type][0]}<small>${LBL[n.type][1]}</small></button>`;
  }).join('');
  app.innerHTML=`${hud(`<button class="iconbtn" data-act="guide" aria-label="Guide">?</button><button class="iconbtn" data-act="crew">Crew</button><button class="iconbtn" data-act="ship">Ship</button>`)}
  <div class="screen">
    <div class="maphead"><h2 style="font-size:19px">${SECTORS[run.sector-1]}</h2><span class="tag">Jump ${run.jumps} · ${run.fuel?'1 fuel per jump':'no fuel left'}</span></div>
    <div class="mapwrap"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${lines}</svg>${nodes}</div>
    <div class="legend"><span style="--c:var(--foe)">Hostile</span><span style="--c:#ff3d5e">Elite</span><span style="--c:var(--ally)">Signal</span><span style="--c:var(--gold)">Trader</span><span style="--c:var(--good)">${run.sector===3?'Flagship':'Gate'}</span></div>
  </div>`;
}
function renderEvent(p){
  const e=EVENTS.find(x=>x.id===p.id);
  app.innerHTML=`${hud()}<div class="screen">
    <div class="tag">Signal</div><h2 class="evtitle">${esc(e.title)}</h2>
    ${p.intro?`<p class="dim" style="margin:0;font-size:13px">${esc(p.intro)}</p>`:''}
    <p class="evtext">${esc(e.text)}</p>
    <div class="choices">${e.choices.map((c,i)=>{const ok=!c.req||c.req(run);return `<button class="btn choice ${c.gate?'gated':''}" data-act="choose" data-i="${i}" ${ok?'':'disabled'}>${esc(c.label)}</button>`}).join('')}</div>
  </div>`;
}
function renderOutcome(p){
  app.innerHTML=`${hud()}<div class="screen">
    <div class="tag">${p.fight?'Hostile contact':'Result'}</div>
    <h2 class="evtitle">${esc(p.title||'')}</h2>
    <p class="evtext">${esc(p.text)}</p>
    ${p.changes&&p.changes.length?`<div class="changes">${p.changes.map(([t,up])=>`<span class="chip ${up?'up':'down'}">${esc(t)}</span>`).join('')}</div>`:''}
    <div class="choices"><button class="btn primary" data-act="outcome">${p.fight?'Battle stations':'Continue'}</button></div>
  </div>`;
}
function renderShop(p){
  const can=c=>run.scrap>=c;
  let rows='';
  if(p.tab==='ship'){
    rows=['reactor',...SYSORDER].map(k=>{const mx=upMaxed(k), pr=upPrice(k);
      return `<div class="srow"><div class="info"><div class="nm">${upName(k)}</div><div class="ds">${esc(upDesc(k))}</div></div>
      <button class="buy" data-act="up" data-k="${k}" ${mx||!can(pr)?'disabled':''}>${mx?'Max':pr}</button></div>`}).join('');
  } else {
    const svc=[
      {k:'hull',nm:'Hull repair',ds:'+5 hull',price:10,ok:run.hull<run.hullMax},
      {k:'heal',nm:'Medical care',ds:'Heal all crew',price:8,ok:run.crew.some(c=>c.hp<crewMax(c))},
      {k:'fuel',nm:'Fuel cell',ds:'+1 fuel',price:4,ok:true},
      {k:'msl',nm:'Missile pair',ds:'+2 missiles',price:7,ok:true},
    ];
    rows=p.stock.map((s,i)=>`<div class="srow"><div class="info"><div class="nm">${esc(s.kind==='crew'?s.c.name+' (crew)':offerTitle(s))}</div><div class="ds">${esc(shopDesc(s))}</div></div>
       <button class="buy" data-act="buy" data-i="${i}" ${s.sold||!can(s.price)?'disabled':''}>${s.sold?'Sold':s.price}</button></div>`).join('')
      + svc.map(s=>`<div class="srow"><div class="info"><div class="nm">${s.nm}</div><div class="ds">${s.ds}</div></div>
       <button class="buy" data-act="svc" data-k="${s.k}" data-p="${s.price}" ${!s.ok||!can(s.price)?'disabled':''}>${s.price}</button></div>`).join('');
  }
  app.innerHTML=`${hud()}<div class="screen">
    <div class="shophead"><div><div class="tag">Trader</div><h2 style="font-size:21px">Black Market Outpost</h2></div><span class="tag">Bays ${run.weapons.length}/4 · Crew ${run.crew.length}/${MAXCREW}</span></div>
    <div class="tabs"><button class="tab ${p.tab!=='ship'?'on':''}" data-act="tab" data-k="gear">Gear &amp; crew</button><button class="tab ${p.tab==='ship'?'on':''}" data-act="tab" data-k="ship">Ship upgrades</button></div>
    <div class="shoplist grow">${rows}</div>
    <button class="btn primary" data-act="leave">Undock</button>
  </div>`;
}

function crewOverlay(){
  const old=app.querySelector('.overlay.crewov'); const sc=old?old.querySelector('.crewlist').scrollTop:0; if(old) old.remove();

function guideOverlay(){

    <p>Your reactor makes a fixed amount of power. Every system draws from it: Shields take 2 power per layer, each weapon has its own cost, Engines give 5% evasion per power, Sensors and the Repair Bay take 1-3. You can't run everything at once, so you choose. In a fight, tap any of your system boxes to open the power panel (the game pauses while it's open). Your setup carries over between fights.</p>
    <h3>Damage takes power away</h3>
    <p>Each system has bars. When a hit lands on a system, it breaks a bar (red). A broken bar can't hold power, so a damaged Shields system loses layers and a damaged Weapons system can't power all its guns. Power comes back on its own once the bar is repaired. Crew on a station and a powered Repair Bay make repairs much faster.</p>
    <h3>Shields first</h3>
    <p>Lasers can't touch hull or systems while shields are up: each shot pops one layer. So you usually aim at their Shields first (it's the default). Once their shields fail, your shots hit hull and break bars in whatever system you're targeting. Missiles ignore shields entirely, which makes them the best way to hit Weapons or Engines early.</p>
    <h3>Weapons</h3>
    <p>You have 4 bays. Every powered weapon fires on its own. Tap a weapon bar in a fight to switch its power on or off. New weapons go into an empty bay, or you pick one to replace. <b>Laser:</b> pops shield layers. <b>Ion:</b> strips a layer and jams it for a few seconds, or jams a system bar if shields are down. <b>Missile</b> (◆): ignores shields, uses ammo. <b>Beam:</b> never misses, loses 1 damage per shield layer.</p>
    <h3>Sensors</h3>
    <p>With at least 1 power in Sensors you see the enemy's weapon charge bars, which turn red just before they fire. Without it you're guessing. More power adds accuracy.</p>
    <h3>Abilities and timing</h3>
    <p><b>Evade</b> gives about a second of 85% dodge. It needs Engines power and a pilot on the Bridge. <b>Surge</b> refills your shields and adds a bonus layer. <b>Overdrive</b> charges weapons almost twice as fast. Time Evade and Surge to the red bars.</p>
    <h3>Crew</h3>
    <p>Stations: Bridge (needed for full evasion and Evade), Shields, Weapons, Engines. Crew boost their station and repair it faster. When their station takes a hit, they get hurt, and at 0 health they die for good. The Repair Bay heals them during fights, and they recover some health after each one. Events can also cost you crew.</p>

function pwState(){

  if(C){ const P=C.P; return {reactor:P.reactor, want:P.want, weapons:P.weapons, lvl:k=>P.sys[k].lvl, cap:k=>cap(P,k), spare:pSpare(P)}; }
  return {reactor:run.reactor, want:run.power, weapons:run.weapons, lvl:k=>run.sys[k].lvl, cap:k=>run.sys[k].lvl, spare:spare()};
}
function barsHTML(lvl,pow,capv,ion){
  let h=''; for(let i=0;i<lvl;i++){ const cls=i<pow?'on':i<capv?'idle':(ion&&i<capv+ion?'ion':'dmg'); h+=`<i class="${cls}"></i>`; } return h;
}

function changePower(k,d){
  const S=pwState();
  if(d>0 && (S.spare<=0 || S.want[k]>=S.lvl(k))) return;
  if(d<0 && S.want[k]<=0) return;
  S.want[k]+=d;
}
function toggleWeapon(i){
  const S=pwState(), w=S.weapons[i], c=WEAPONS[w.id].pw;
  if(w.on){ w.on=false; return; }
  const used=sum(S.weapons.filter(x=>x.on).map(x=>WEAPONS[x.id].pw));
  if(S.spare<c){ toast(`Not enough reactor power. Free up ${c-S.spare} from another system.`); return; }
  if(used+c>S.lvl('wep')){ toast(`Weapons system is full (${used}/${S.lvl('wep')} bars). Turn another weapon off or buy more bars.`); return; }
  w.on=true; if(C) w.charge=0;
}

app.addEventListener('click',e=>{

    case 'close': b.closest('.overlay').remove(); if(!C) save(); break;

    case 'tip': toast({h:`Hull: your ship's health. At 0 the run ends.`,

      m:'Missiles: ammo for missile weapons (◆). One per volley. They ignore shields.',
      s:'Scrap: money for weapons, upgrades, crew, repairs, fuel, and missiles at traders.'}[b.dataset.k],4200); break;
    case 'pw': changePower(b.dataset.k,+b.dataset.d); powerSheet(); break;
    case 'wtog': toggleWeapon(+b.dataset.i); powerSheet(); break;
    case 'pwopen': if(C&&!C.over){ C.paused=true; powerSheet(); } break;
    case 'pwdone': b.closest('.overlay').remove(); if(C){ C.paused=false; lastT=performance.now(); rebuildWeps(); } break;
    case 'wquick': if(C&&!C.over){ toggleWeapon(+b.dataset.i); } break;
    case 'ewtip': if(C){ const w=C.E.weapons[+b.dataset.i]; toast(`Enemy ${w.name}: ${wdesc(w.id)}. When this bar turns red it is about to fire.`,4000); } break;
    case 'choose': {
      const ev=EVENTS.find(x=>x.id===p.id), c=ev.choices[+b.dataset.i];
      const out=c.go();
      run.pending={kind:'outcome', title:ev.title, text:out.text, changes:out.changes, fight:out.fight||null, elite:out.elite||false, bonusCrew:out.bonusCrew||false, weapon:out.weapon||null};
      save(); render(); break;
    }
    case 'outcome': {
      if(p.fight){ run.pending={kind:'combat', foe:p.fight, elite:p.elite, bonusCrew:p.bonusCrew, intro:''}; }
      else if(p.weapon){ if(run.weapons.length<4){ installWeapon(p.weapon); run.pending=null; } else run.pending={kind:'replace',weapon:p.weapon,next:null}; }
      else run.pending=null;
      save(); render(); break;
    }
    case 'tab': p.tab=b.dataset.k; save(); render(); break;
    case 'buy': {
      const s=p.stock[+b.dataset.i]; if(s.sold||run.scrap<s.price) return;
      if(s.kind==='weapon' && run.weapons.length>=4){ toast('Weapon bays full (4). Replace one from a reward screen.'); return; }
      if(s.kind==='crew' && run.crew.length>=MAXCREW){ toast(`No room: ${MAXCREW} crew is the maximum.`); return; }
      run.scrap-=s.price; s.sold=true;
      if(s.kind==='weapon') installWeapon(s.id); else if(s.kind==='crew') addCrew(s.c); else givePerk(s.id);
      save(); render(); break;
    }
    case 'up': { const k=b.dataset.k, pr=upPrice(k); if(run.scrap<pr||upMaxed(k)) return; run.scrap-=pr; buyUp(k); toast(k==='reactor'?'Reactor upgraded. Open Ship → Power setup to use the extra power.':`${SYSDEF[k].name} upgraded. Add power to the new bar from Ship → Power setup.`); save(); render(); break; }
    case 'svc': {
      const price=+b.dataset.p; if(run.scrap<price) return; run.scrap-=price;
      const k=b.dataset.k;
      if(k==='hull') run.hull=Math.min(run.hullMax,run.hull+5); else if(k==='fuel') run.fuel++; else if(k==='heal') run.crew.forEach(c=>c.hp=crewMax(c)); else run.missiles+=2;
      save(); render(); break;
    }

    case 'ability': useAbility(b.dataset.k); break;
    case 'pause': if(C){ C.paused=true; shipOverlay(true); } break;
    case 'resume': b.closest('.overlay').remove(); if(C){ C.paused=false; lastT=performance.now(); } break;
    case 'abandon': b.textContent='Tap again to abandon'; b.dataset.act='abandon2'; break;

const SPEED=Math.max(1,Math.min(40,+new URLSearchParams(location.search).get('speed')||1));
let C=null, raf=0, lastT=0, cv=null, cx=null, CW=0, CH=0, DPR=1;
function mkSys(lvl){ return {lvl, dmg:0, ion:0, ionT:0, rt:0, pow:0, flash:0}; }
function mkWeapon(id, start, on){ const w=WEAPONS[id]; return {id, ...w, charge:start*w.cd, on, powered:false}; }
// capacity = bars that are neither broken nor jammed
const cap=(s,k)=>Math.max(0,s.sys[k].lvl-s.sys[k].dmg-(s.sys[k].ionT>0?s.sys[k].ion:0));
const layersOf=s=>Math.floor(s.sys.shd.pow/2);
const pSpare=P=>P.reactor-sum(['shd','eng','sen','rep'].map(k=>P.want[k]))-sum(P.weapons.filter(w=>w.on).map(w=>w.pw));
function applyPower(s){
  for(const k of ['shd','eng','sen','rep']) if(s.sys[k]) s.sys[k].pow=Math.min(s.want[k],cap(s,k));
  let wcap=cap(s,'wep'), used=0;
  for(const w of s.weapons){ w.powered=false; if(w.on && used+w.pw<=wcap){ w.powered=true; used+=w.pw; } }
  s.sys.wep.pow=used;
}
function makePlayer(){
  const sys={}; for(const k of SYSORDER) sys[k]=mkSys(run.sys[k].lvl);
  const crewLv={shd:stLv('shd'),wep:stLv('wep'),eng:stLv('eng'),helm:stLv('helm')};
  const P={player:true, name:'Starwake', shape:'player', hull:run.hull, hullMax:run.hullMax, reactor:run.reactor, sys, want:run.power, crewLv,
    weapons:run.weapons.map(w=>Object.assign(mkWeapon(w.id,.1,w.on),{ref:w})), shields:0, shieldT:0,
    acc:.08*perk('targeting')+.05*traitCount('deadeye'),
    chargeMul:(1+.12*perk('capacitor'))*(1+.06*crewLv.wep+.08*traitCount('gunner')),
    repairMul:(1+.4*perk('drones'))*(1+.3*traitCount('tinker'))*(1+.12*run.crew.filter(c=>!c.station).length),
    regen:2.2/(1+.10*crewLv.shd), evading:0, od:0, over:0, hitFlash:0, shieldFlash:0, healT:0, x:0,y:0, size:1};
  applyPower(P); P.shields=layersOf(P);
  return P;
}
function makeFoe(key, elite){
  const f=FOES[key], s=run.sector;
  let hull=f.hull+2+4*(s-1), layers=f.layers+(s===3&&!f.boss?1:0), eng=f.eng;
  let weapons=f.w.slice(), name=f.name, ai=(f.ai||[]).slice();
  if(key==='gate' && s===1){ ai=[]; layers=1; }
  if(!elite && !f.boss && key!=='gate' && s>=2 && R()<.5) weapons.push(randWeapon(s));
  if(elite){ hull=Math.round(hull*(s===1?1.4:1.3)); if(s>=2) layers=Math.min(4,layers+1); weapons.push(randWeapon(Math.min(3,s+1))); name='Veteran '+name; }
  layers=Math.min(4,layers);
  const wl=sum(weapons.map(id=>WEAPONS[id].pw))+(s>=2?1:0)+(f.boss?1:0);
  const sys={shd:mkSys(layers*2+(layers>0?1:0)), wep:mkSys(wl), eng:mkSys(eng)};
  const E={player:false, key, name, shape:f.shape, hull, hullMax:hull, sys, want:{shd:99,eng:99}, acc:0, eva:0,
    chargeMul:1.15+.08*(s-1), repairMul:f.boss?.8:1, weapons:weapons.map(id=>mkWeapon(id,R()*.35,true)), ai, boss:!!f.boss,
    abT:{evade:4+R()*4, surge:6}, shields:0, shieldT:0, evading:0, od:0, over:0, hitFlash:0, shieldFlash:0, phase:1, elite:!!elite, x:0,y:0, size:f.boss?1.35:1};
  applyPower(E); E.shields=layersOf(E);

}
function evasion(s,att){

  return clamp(e-(att?att.acc:0),0,.6);
}
function accuracyOf(s){ return s.player? .10*Math.max(0,s.sys.sen.pow-1) : 0; }
const helmMul=()=>1-.05*stLv('helm');
const AB={

function float(s,text,color,dy=0){ C.texts.push({x:s.x+(R()-.5)*30,y:s.y-s.r*.6+dy,text,color,life:1.2}); }
function burst(x,y,color,n,sp=120,life=.6){ for(let i=0;i<n;i++){const a=R()*Math.PI*2,v=sp*(.3+R());C.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:life*(.6+R()*.6),max:life,color,size:1+R()*2.5});} }

function step(dt){
  C.t+=dt;
  const {P,E}=C;
  for(const k in C.ab) C.ab[k].t=Math.max(0,C.ab[k].t-dt);
  if(!C.over){
    tickShip(P,E,dt); tickShip(E,P,dt); enemyAI(dt);
    if(E.boss && E.phase===1 && E.hull<=E.hullMax/2){
      E.phase=2; E.chargeMul*=1.25; for(const k in E.sys){E.sys[k].dmg=0;E.sys[k].ionT=0;} applyPower(E); E.shields=layersOf(E)+1; E.over=1;
      toast('The Regent vents its reactor. All systems restored, weapons overcharged.'); C.shake=10;
    }
  }
  for(const p of C.proj){
    p.t+=dt;
    if(p.t<0) continue;
    if(!p.done && p.t>=p.dur){ p.done=true; resolveHit(p); }
    if(p.done && (!p.miss || p.t>p.dur+.6)) p.dead=true;
  }
  C.proj=C.proj.filter(p=>!p.dead);
  for(const b of C.beams) b.life-=dt; C.beams=C.beams.filter(b=>b.life>0);
  for(const q of C.parts){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.vx*=.96; q.vy*=.96; q.life-=dt; } C.parts=C.parts.filter(q=>q.life>0);
  for(const t of C.texts){ t.y-=26*dt; t.life-=dt; } C.texts=C.texts.filter(t=>t.life>0);
  C.shake=Math.max(0,C.shake-dt*30);
  for(const s of [P,E]){ s.hitFlash=Math.max(0,s.hitFlash-dt*3); s.shieldFlash=Math.max(0,s.shieldFlash-dt*2.5); for(const k in s.sys) s.sys[k].flash=Math.max(0,s.sys[k].flash-dt*2); }
  if(!C.over){
    if(E.hull<=0){ C.over='win'; C.endT=1.8; explode(E); run.kills++; buzz(60); }
    else if(P.hull<=0){ C.over='lose'; C.endT=2.2; explode(P); buzz(200); }
  } else {
    C.endT-=dt;
    if(C.endT<=0) endCombat();
  }
}
function explode(s){ C.shake=16; for(let i=0;i<5;i++) burst(s.x+(R()-.5)*s.r,s.y+(R()-.5)*s.r,pick(['#ffd27a','#ff7448','#fff']),26,180,1.1); s.dead=true; }

const STATION_OF={shd:'shd',wep:'wep',eng:'eng'};
function tickShip(s,o,dt){
  s.evading=Math.max(0,s.evading-dt); s.od=Math.max(0,s.od-dt);
  // repairs and jams
  const repPow=s.player?s.sys.rep.pow:0;
  for(const k in s.sys){
    const y=s.sys[k];
    if(y.ionT>0){ y.ionT-=dt; if(y.ionT<=0){ y.ionT=0; y.ion=0; } }
    if(y.dmg>0){
      let rate=s.repairMul;
      if(s.player){ const lv=s.crewLv[STATION_OF[k]]||0; rate*=(lv?1+.25*lv:.45)*(1+.5*repPow); }
      else rate*=.8;
      y.rt+=dt*rate;
      if(y.rt>=7){ y.rt=0; y.dmg--; if(s.player) float(s,`${SYSDEF[k].name} bar repaired`,'#5ee3a4',20); }
    } else y.rt=0;
  }
  applyPower(s);
  // crew healing in the repair bay
  if(s.player && repPow>0){ s.healT+=dt*repPow; if(s.healT>=4){ s.healT=0; run.crew.forEach(c=>{ if(c.hp<crewMax(c)) c.hp++; }); } }
  // shields
  const L=layersOf(s);
  if(s.shields<=L) s.over=0;
  if(s.shields>L+(+s.over||0)) s.shields=L+(+s.over||0);
  if(s.shields<L && s.sys.shd.ionT<=0){ s.shieldT+=dt; const regen=s.player?s.regen:(2.8-.3*(run.sector-1))*(1+Math.max(0,(C.t-70)/50)); if(s.shieldT>=regen){ s.shieldT=0; s.shields++; } } else s.shieldT=0;
  // weapons
  for(const w of s.weapons){
    w.noAmmo=false;
    if(!w.powered){ w.charge=Math.max(0,w.charge-dt*w.cd*.5); continue; }
    w.charge=Math.min(w.cd, w.charge+dt*s.chargeMul*(s.od>0?1.9:1));
    if(w.charge>=w.cd){
      if(w.ammo && s.player && run.missiles<=0){ w.noAmmo=true; continue; }
      if(w.ammo && s.player) run.missiles--;
      fire(s,o,w); w.charge=0;
    }
  }
}
function enemyAI(dt){
  const {E,P}=C;
  E.abT.evade-=dt; E.abT.surge-=dt;
  const incoming=C.proj.some(p=>p.dst===E && !p.done && p.type!=='beam');
  if(E.ai.includes('evade') && E.abT.evade<=0 && incoming && cap(E,'eng')>0 && R()<dt*2){ E.evading=1.5; E.abT.evade=15+R()*5; float(E,'EVASIVE','#5ee3a4'); }
  if(E.ai.includes('surge') && E.abT.surge<=0 && E.shields===0 && incoming && layersOf(E)>0){ E.shields=layersOf(E)+1; E.over=1; E.shieldFlash=1; E.abT.surge=22; float(E,'SURGE','#79b8ff'); }
}
function fire(s,o,w){
  let tgt;
  if(s.player) tgt=C.target;
  else { const r=R(); tgt = r<.4?'shd':r<.7?'wep':r<.88?'eng':'helm'; }
  let dmg=w.dmg; if(s.player && w.type==='missile') dmg+=perk('magazine');
  for(let i=0;i<w.shots;i++){
    C.proj.push({src:s,dst:o,type:w.type,dmg,sysDmg:w.sys||1,sys:tgt,t:-i*.16,dur:w.type==='missile'?1.4:w.type==='beam'?.25:.8,
      ox:(R()-.5)*.5, oy:(R()-.5)*.4, mx:(R()<.5?-1:1)*(40+R()*40)});
  }
}
function resolveHit(p){
  const d=p.dst, s=p.src;
  if(d.dead||C.over){ p.dead=true; return; }
  if(p.type==='beam'){
    const dmg=Math.max(0,p.dmg-d.shields);
    C.beams.push({s,d,life:.45,color:s.player?'#9fe2ff':'#ffb38f'});
    if(dmg<=0){ d.shieldFlash=1; float(d,'BLOCKED','#79b8ff'); if(d.player) C.st.block++; return; }
    damage(d,dmg,p); return;
  }
  if(R()<evasion(d,s)-accuracyOf(s)){ p.miss=true; const dodge=d.evading>0; float(d,dodge?'DODGED':'MISS',dodge?'#5ee3a4':'#8d98c6'); if(d.player) C.st.dodge++; return; }
  if(p.type==='missile'){
    if(d.player && perk('pointdef') && R()<.25*perk('pointdef')){ p.dead=true; burst(d.x,d.y-d.r*1.2,'#ffd27a',12); float(d,'SHOT DOWN','#ffc65c'); return; }
    damage(d,p.dmg,p); return;
  }
  if(p.type==='ion'){
    if(d.shields>0){ d.shields--; const y=d.sys.shd; y.ion=Math.min(y.lvl,y.ion+1); y.ionT=4; d.shieldFlash=1; float(d,'ION','#a08bff'); burst(d.x,d.y,'#a08bff',8,90); if(d.player) C.st.block++; return; }
    const k=p.sys==='helm'?'eng':p.sys, y=d.sys[k]; y.ion=Math.min(y.lvl,y.ion+1); y.ionT=5; y.flash=1; float(d,`${SYSDEF[k].name} jammed`,'#a08bff'); burst(d.x,d.y,'#a08bff',14,110); return;
  }
  if(d.shields>0){ d.shields--; d.shieldFlash=1; float(d,'BLOCKED','#79b8ff'); if(d.player) C.st.block++; burst(d.x+(R()-.5)*d.r,d.y+(s.player?1:-1)*d.r*1.1,'#79b8ff',6,80,.4); return; }
  damage(d,p.dmg,p);
}
function damage(d,dmg,p){
  d.hull=Math.max(0,d.hull-dmg); d.hitFlash=1;
  if(!d.player) C.st.hit++;
  float(d,`-${dmg}`,'#ff4f6d');
  burst(d.x+(R()-.5)*d.r,d.y+(R()-.5)*d.r,'#ffb35c',16,140);
  C.shake=Math.max(C.shake,d.player?7:4);
  const k=p.sys;
  if(k!=='helm' && d.sys[k]){
    const saved=d.player && perk('housing') && R()<.3*perk('housing');
    if(!saved){ const y=d.sys[k]; y.dmg=Math.min(y.lvl,y.dmg+p.sysDmg); y.flash=1; y.rt=0; applyPower(d); }
  }
  if(d.player){
    buzz(25);
    const c=crewAt(k==='helm'?'helm':STATION_OF[k]);
    if(c){
      const n=Math.max(1,Math.round((dmg+ri(1,2))*(perk('armor')?.6:1)));
      c.hp-=n;
      if(c.hp<=0){ run.crew.splice(run.crew.indexOf(c),1); C.deaths.push(c.name); float(d,`${c.name} killed`,'#ff4f6d',-18); toast(`${c.name} was killed at the ${STATIONS[c.station]} station.`,3500); refreshCrewLv(d); }
      else float(d,`${c.name} hurt`,'#ffb35c',-18);
    }
  }
}
function refreshCrewLv(P){ P.crewLv={shd:stLv('shd'),wep:stLv('wep'),eng:stLv('eng'),helm:stLv('helm')}; P.regen=2.2/(1+.10*P.crewLv.shd); }
function endCombat(){
  const p=C.p, won=C.over==='win', st=C.st, deaths=C.deaths;
  run.hull=Math.max(0,Math.ceil(C.P.hull));
  run.weapons=C.P.weapons.map(w=>({id:w.id,on:w.on}));
  stopCombat();
  if(!won){ endRun(false); save(); render(); return; }
  if(p.boss){ endRun(true); save(); render(); return; }
  const loot=[];
  deaths.forEach(n=>loot.push([`${n} died`,false]));
  const mult=(p.elite?1.6:p.gate?1.5:1)*(1+.3*perk('salvage'))*(1+.15*traitCount('scav'));
  const scrap=Math.round((14+6*run.sector+ri(0,8))*mult); run.scrap+=scrap; loot.push([`+${scrap} scrap`,true]);
  if(R()<.5||run.fuel<3){ const f=ri(1,2); run.fuel+=f; loot.push([`+${f} fuel`,true]); }
  if(R()<.45){ const m=ri(1,3); run.missiles+=m; loot.push([`+${m} missiles`,true]); }
  if(perk('drones')){ const h=Math.min(run.hullMax-run.hull,3*perk('drones')); if(h>0){ run.hull+=h; loot.push([`+${h} hull repaired`,true]); } }
  const heal=4+3*run.sys.rep.lvl*(run.power.rep>0?1:0)+4*traitCount('medic');
  run.crew.forEach(c=>c.hp=Math.min(crewMax(c),c.hp+heal));
  const act={wep:Math.min(2,Math.floor(st.hit/3)), shd:Math.min(2,Math.floor(st.block/3)), eng:Math.min(2,Math.floor(st.dodge/2)), helm:Math.min(2,Math.floor(st.ab/2))};
  const xm=(p.elite||p.gate)?1.5:1;
  run.crew.forEach(c=>giveXP(c,c.station?(1+act[c.station])*xm:0,loot));
  if(p.bonusCrew){ const c=makeCrew(recruitLv()); if(addCrew(c)) loot.push([`Freed prisoner ${c.name} joins`,true]); }
  // keep power wants inside the reactor if crew/weapons changed
  const next=p.gate?'gate':null;
  const offers=makeOffers(p.elite||p.gate);
  if(p.gate && run.crew.length<MAXCREW && !offers.some(o=>o.kind==='crew')){ const c=makeCrew(recruitLv()); offers[2]={kind:'crew',id:c.name,c}; }
  if(p.gate && !offers.some(o=>o.kind==='up'&&o.id==='reactor')) offers[0]={kind:'up',id:'reactor'};
  run.pending={kind:'reward', loot, offers, next};
  save(); render();
}

/* ---------- combat drawing ---------- */
function loop(now){
  if(!C) return;
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  if(!C.paused) for(let i=0;i<SPEED&&C;i++) step(dt);
  if(!C) return;
  draw(); syncDOM();
  raf=requestAnimationFrame(loop);
}
function shipPos(){
  const {P,E}=C;
  const r=Math.min(CW*.17, CH*.15);
  P.r=r; E.r=r*E.size;
  const bob=Math.sin(C.t*1.3)*3;
  P.x=CW/2 + (P.evading>0?Math.sin(C.t*9)*r*.35:0); P.y=CH*.76+bob;
  E.x=CW/2 + (E.evading>0?Math.sin(C.t*9)*r*.35:0); E.y=CH*.25-bob;
}
function draw(){
  if(!CW||!CH){ sizeCanvas(); if(!CW) return; }
  shipPos();
  const g=cx; g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='#070912'; g.fillRect(0,0,CW,CH);
  for(const s of C.stars){ s.y+=(C.paused?0:.0009*s.z); if(s.y>1) s.y-=1; g.fillStyle=`rgba(200,215,255,${.25+.6*s.z*s.z})`; g.fillRect(s.x*CW,s.y*CH,s.z*1.8,s.z*1.8); }
  const neb=g.createRadialGradient(CW*.8,CH*.3,0,CW*.8,CH*.3,CW*.8); neb.addColorStop(0,'rgba(80,60,160,.16)'); neb.addColorStop(1,'rgba(80,60,160,0)'); g.fillStyle=neb; g.fillRect(0,0,CW,CH);
  g.save();
  if(C.shake>0) g.translate((R()-.5)*C.shake,(R()-.5)*C.shake);
  drawShip(C.E,true); drawShip(C.P,false);
  if(C.P.sys.sen.pow>0){ const E=C.E, hot=Math.max(0,...E.weapons.filter(w=>w.powered).map(w=>w.charge/w.cd));
    if(!E.dead && !C.over && hot>.8){ const a=(hot-.8)/.2; g.fillStyle=`rgba(255,79,109,${.3+.5*a})`; g.shadowColor='#ff4f6d'; g.shadowBlur=20; g.beginPath(); g.arc(E.x,E.y+E.r*.95,4+9*a,0,7); g.fill(); g.shadowBlur=0; } }
  for(const b of C.beams){ const a=b.life/.45; g.strokeStyle=b.color; g.globalAlpha=a; g.lineWidth=3+5*a; g.shadowColor=b.color; g.shadowBlur=14;
    g.beginPath(); g.moveTo(b.s.x,b.s.y+(b.s.player?-b.s.r:b.s.r)); g.lineTo(b.d.x,b.d.y); g.stroke(); g.shadowBlur=0; g.globalAlpha=1; }
  for(const p of C.proj){
    if(p.t<0) continue;
    const s=p.src, d=p.dst;
    const sx=s.x+p.ox*s.r, sy=s.y+(s.player?-s.r*.9:s.r*.9);
    const tx=d.x+p.ox*d.r*.8, ty=d.y+p.oy*d.r;
    const k=p.t/p.dur;
    let x,y;
    if(p.type==='missile'){ const e=k*k*(3-2*k); x=sx+(tx-sx)*Math.min(1,e)+Math.sin(Math.min(1,k)*Math.PI)*p.mx; y=sy+(ty-sy)*Math.min(1,e); if(k>1){ y+=(ty-sy)*(k-1); } }
    else { x=sx+(tx-sx)*k; y=sy+(ty-sy)*k; }
    if(p.done && !p.miss) continue;
    const col=s.player?'#9fe2ff':'#ffad7a';
    if(p.type==='laser'){ const L=Math.hypot(tx-sx,ty-sy)||1, dx=(tx-sx)/L, dy=(ty-sy)/L;
      g.strokeStyle=col; g.lineWidth=3; g.shadowColor=col; g.shadowBlur=10; g.beginPath(); g.moveTo(x,y); g.lineTo(x-dx*16,y-dy*16); g.stroke(); g.shadowBlur=0; }
    else if(p.type==='ion'){ g.fillStyle='#b9a8ff'; g.shadowColor='#a08bff'; g.shadowBlur=16; g.beginPath(); g.arc(x,y,5+Math.sin(C.t*30)*1.5,0,7); g.fill(); g.shadowBlur=0; }
    else if(p.type==='missile'){ g.fillStyle=s.player?'#dff4ff':'#ffd9c4'; g.beginPath(); g.arc(x,y,3.5,0,7); g.fill();
      if(!C.paused&&R()<.8) C.parts.push({x,y,vx:(R()-.5)*20,vy:(s.player?1:-1)*30,life:.4,max:.4,color:'#ffb35c',size:2}); }
  }
  for(const q of C.parts){ g.globalAlpha=clamp(q.life/q.max,0,1); g.fillStyle=q.color; g.fillRect(q.x-q.size/2,q.y-q.size/2,q.size,q.size); }
  g.globalAlpha=1;
  g.font='700 13px "Chakra Petch", system-ui, sans-serif'; g.textAlign='center';
  for(const t of C.texts){ g.globalAlpha=clamp(t.life,0,1); g.fillStyle='rgba(0,0,0,.6)'; g.fillText(t.text,t.x+1,t.y+1); g.fillStyle=t.color; g.fillText(t.text,t.x,t.y); }
  g.globalAlpha=1;
  g.restore();
  if(C.over){ g.fillStyle='rgba(7,9,18,.35)'; g.fillRect(0,0,CW,CH); g.font='700 26px "Chakra Petch", system-ui'; g.textAlign='center'; g.fillStyle=C.over==='win'?'#5ee3a4':'#ff4f6d'; g.fillText(C.over==='win'?'TARGET DESTROYED':'HULL BREACH',CW/2,CH/2+8); }
}
function drawShip(s,flip){

  g.fillStyle=base; g.globalAlpha=.85; g.beginPath(); g.ellipse(0,-r*.35,r*.09,r*.17,0,0,7); g.fill(); g.globalAlpha=1;
  const lights={wep:[0,-r*.62],shd:[0,r*.05],eng:[0,r*.55]};
  for(const k in lights){ const y=s.sys[k]; const [lx,ly]=lights[k];
    g.fillStyle=y.ionT>0?'#a08bff':y.dmg>=y.lvl&&y.lvl>0?'#ff4f6d':y.dmg>0?'#ffc65c':'#5ee3a4';
    g.beginPath(); g.arc(lx,ly,r*.06+(y.flash*r*.06),0,7); g.fill(); }
  if(s.hitFlash>0){ g.globalAlpha=s.hitFlash*.5; g.fillStyle='#fff'; g.beginPath(); pts.forEach(([x,y],i)=>i?g.lineTo(x*r,y*r):g.moveTo(x*r,y*r)); g.closePath(); g.fill(); g.globalAlpha=1; }
  g.restore();
  if(s.shields>0||s.shieldFlash>0){
    for(let i=0;i<Math.max(1,s.shields);i++){
      g.strokeStyle=(s.over&&i>=s.shields-s.over)?'#ffffff':'#79b8ff';
      g.globalAlpha=(s.shields>0?.35:0)+s.shieldFlash*.5; g.lineWidth=1.5+s.shieldFlash*2;
      g.beginPath(); g.ellipse(s.x,s.y,r*1.25+i*6,r*1.12+i*6,0,0,7); g.stroke();
    }
    g.globalAlpha=1;
  }
  if(s.evading>0){ g.strokeStyle='rgba(94,227,164,.5)'; g.setLineDash([4,6]); g.lineWidth=1.5; g.beginPath(); g.ellipse(s.x,s.y,r*1.6,r*1.4,0,0,7); g.stroke(); g.setLineDash([]); }
}
function pipsHTML(n,max,over){ let h=''; for(let i=0;i<Math.max(max,n);i++) h+=`<span class="pip ${i<n?(over&&i>=n-over?'over':'on'):''}"></span>`; return h; }
let domCache={};
function setHTML(id,html){ if(domCache[id]===html) return; domCache[id]=html; const el=document.getElementById(id); if(el) el.innerHTML=html; }
function setInner(el,html){ if(el.dataset.h===html) return; el.dataset.h=html; el.innerHTML=html; }
function syncDOM(){
  const {P,E}=C;
  if((P.sys.sen.pow>0)!==C.senShown) rebuildWeps();
  document.getElementById('eHp').style.width=`${100*E.hull/E.hullMax}%`;
  document.getElementById('pHp').style.width=`${100*P.hull/P.hullMax}%`;
  setHTML('eHpN',`${Math.ceil(E.hull)}/${E.hullMax}`);
  setHTML('pHpN',`${Math.ceil(P.hull)}/${P.hullMax}`);
  setHTML('eSh',pipsHTML(E.shields,layersOf(E),E.over));
  setHTML('pSh',pipsHTML(P.shields,layersOf(P),P.over));
  for(const k in TGT){
    const t=document.getElementById('t_'+k), y=E.sys[k]; t.classList.toggle('sel',C.target===k);
    setInner(t.querySelector('.bars'), barsHTML(y.lvl,y.pow,cap(E,k),y.ionT>0?y.ion:0));
  }
  for(const k of SYSORDER){
    const el=document.getElementById('s_'+k), y=P.sys[k];
    setInner(el.querySelector('.bars'), barsHTML(y.lvl,y.pow,cap(P,k),y.ionT>0?y.ion:0));
    const st=STATION_OF[k], c=st&&crewAt(st);
    let badge=el.querySelector('.cr');
    const want=c?`L${c.lv}`:'';
    if(want){ if(!badge){ badge=document.createElement('span'); badge.className='cr'; el.appendChild(badge);} badge.textContent=want; badge.classList.toggle('hurt',c.hp<crewMax(c)*.5); }
    else if(badge) badge.remove();
  }
  P.weapons.forEach((w,i)=>{ const el=document.getElementById('w_'+i); if(!el) return; el.firstChild.style.width=`${100*w.charge/w.cd}%`;
    el.classList.toggle('noammo',!!w.noAmmo); el.classList.toggle('ready',w.charge>=w.cd*.92); el.classList.toggle('off',!w.on); el.classList.toggle('nopow',w.on&&!w.powered); });
  if(C.senShown) E.weapons.forEach((w,i)=>{ const el=document.getElementById('ew_'+i); if(!el) return; const r=w.charge/w.cd; el.firstChild.style.width=`${100*r}%`; el.classList.toggle('hot',r>.8&&w.powered&&!C.over); el.classList.toggle('off',!w.powered); });
  const inc=!C.over&&C.proj.some(p=>p.dst===P&&!p.done&&p.t>-.3&&p.type!=='beam');
  if(inc && !C.paused && !meta.tipInc && C.ab.evade.t<=0){ meta.tipInc=1; save(); toast('Shots incoming! Tap Evade to dodge them, or Surge for extra shields.',3500); }
  for(const k in AB){
    const el=document.getElementById('a_'+k), a=C.ab[k];
    el.classList.toggle('incoming',inc&&k!=='od');
    el.style.setProperty('--p',(a.t/AB[k].cd()).toFixed(3));
    el.classList.toggle('ready',a.t<=0);
    el.classList.toggle('active',(k==='evade'&&P.evading>0)||(k==='od'&&P.od>0));
  }
  const res=app.querySelectorAll('.hud .res');
  if(res.length===4){ res[0].lastChild.textContent=`${Math.ceil(P.hull)}/${P.hullMax}`; res[2].lastChild.textContent=run.missiles; }
}

/* ---------- boot ---------- */
load();
if(run && (!run.sys || !run.map)) run=null;
render();
</script>
